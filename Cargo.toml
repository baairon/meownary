[package]
name = "meownary"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal tool that deattributes software and scrubs files to prepare them for reverse engineering, writing clean copies without the brand labels, toolchain stamps and patch credits that name who made them, and stripping metadata from the documents, photos and media you pick."
license = "MIT"
authors = ["bairon"]
repository = "https://github.com/baairon/meownary"
homepage = "https://github.com/baairon/meownary"
readme = "README.md"
keywords = ["forensics", "binary", "authenticity", "tui", "audit"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/.github", "/target"]

[dependencies]
aho-corasick = "1.1.5"
blake3 = "1.8.7"
directories = "6.0.0"
rayon = "1.12.0"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
# Every ratatui default feature except the non-crossterm backends.
ratatui = { version = "0.30.2", optional = true, default-features = false, features = [
    "all-widgets",
    "crossterm",
    "layout-cache",
    "macros",
    "underline-color",
] }
crossterm = { version = "0.29.0", optional = true }
# Display widths for the view's column math; already in the tree through ratatui.
unicode-width = { version = "0.2.2", optional = true }
miniz_oxide = { version = "0.9", features = ["with-alloc"] }

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width"]

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# The per-file scan guard relies on catch_unwind, so panics must unwind, never abort.
panic = "unwind"
