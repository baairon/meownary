[package]
name = "meownary"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lean terminal tool that identifies what any file really is, flags tampered or mislabeled binaries, and cleans their markers in bulk."
license = "MIT"
authors = ["bairon"]
repository = "https://github.com/baairon/meownary"
readme = "README.md"
keywords = ["forensics", "binary", "authenticity", "tui", "audit"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
aho-corasick = "1.1.5"
blake3 = "1.8.7"
directories = "6.0.0"
lexopt = "0.3.2"
memmap2 = "0.9.11"
rayon = "1.12.0"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29.0", optional = true }

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
